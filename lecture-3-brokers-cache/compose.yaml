services:
  user-service:
    build:
      context: ./user-service
    ports:
      - "5000:5000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: orders
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  picker-service:
    build:
      context: ./picker-service
    environment:
      INSTANCE_NAME: picker-1
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: orders
      KAFKA_GROUP_ID: pickers
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "5001:5001"

  picker-service-2:
    build:
      context: ./picker-service
    environment:
      INSTANCE_NAME: picker-2
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: orders
      KAFKA_GROUP_ID: pickers
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "5002:5001"
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.11.0
    command:
      - --kafka.server=kafka:19092
      - --topic.filter=^orders$
      - --group.filter=^pickers$
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "9308:9308"

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - kafka-exporter
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.3.0
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/dashboards.yml:/etc/grafana/provisioning/dashboards/kafka.yml:ro
      - ./monitoring/kafka-dashboard.json:/var/lib/grafana/dashboards/kafka-dashboard.json:ro
  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --list > /dev/null 2>&1
        do
          echo "Waiting for Kafka..."
          sleep 2
        done

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic orders \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=172800000

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --alter \
          --topic orders \
          --partitions 3 \
        || echo "Partition count was not changed, possibly already 3."

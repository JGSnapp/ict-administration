<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сервис сборщика</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <p class="eyebrow">PICKER SERVICE</p>
    <h1>Обработка заказов</h1>

    <section>
      <h2>Последний результат</h2>
      <p id="output" role="status" aria-live="polite">
        Сборщик ожидает заказ.
      </p>
    </section>
  </main>

  <script>
    const output = document.getElementById('output');

    async function updateStatus() {
      try {
        const response = await fetch('/api/status');
        const data = await response.json();

        if (data.status === 'waiting') {
          output.textContent =
            `${data.instance}: ожидает заказ из Kafka.`;
          return;
        }

        output.textContent =
          `${data.instance}: обработан ${data.order_id}; ` +
          `partition ${data.partition}, offset ${data.offset}; ` +
          `товары: ${data.items.join(', ')}.`;
      } catch (error) {
        output.textContent =
          `Не удалось получить состояние: ${error.message}`;
      }
    }

    updateStatus();
    setInterval(updateStatus, 1000);
  </script>
</body>
</html>

groups:
  - name: lab-service-alerts
    rules:
      - alert: ErrorRateHigh
        expr: |
          100 *
          sum(rate(http_errors_total{job="lab-service"}[1m]))
          /
          sum(rate(http_requests_total{job="lab-service"}[1m]))
          > 5
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Высокая доля ошибок"
          description: "Доля HTTP 5xx выше 5%."

      - alert: RequestRateHigh
        expr: |
          sum(rate(http_requests_total{job="lab-service"}[1m])) > 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Высокая интенсивность запросов"
          description: "Интенсивность запросов выше 1 req/s."

      - alert: P95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{job="lab-service"}[1m])
            )
          ) > 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Высокий p95"
          description: "95-й перцентиль времени ответа выше 1 секунды."